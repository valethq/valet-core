name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valet-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: valet-core
      - uses: actions/checkout@v4
        with:
          repository: valethq/valet-agent
          path: valet-agent
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
